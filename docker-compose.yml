version: '3.9'

services:
  # ─── Banco de Dados ───────────────────────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    container_name: omnidesk_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: omnidesk
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - '5432:5432'
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres']
      interval: 10s
      timeout: 5s
      retries: 5

  # ─── Cache / Sessões / Filas ──────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: omnidesk_redis
    restart: unless-stopped
    command: redis-server --maxmemory 512mb --maxmemory-policy allkeys-lru
    volumes:
      - redis_data:/data
    ports:
      - '6379:6379'
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 5s
      retries: 5

  # ─── WhatsApp (Evolution API) ─────────────────────────────────────────────────
  evolution_api:
    image: atendai/evolution-api:latest
    container_name: omnidesk_evolution
    restart: unless-stopped
    ports:
      - '8080:8080'
    environment:
      SERVER_URL: http://localhost:8080
      AUTHENTICATION_TYPE: apikey
      AUTHENTICATION_API_KEY: omnidesk-evolution-key-change-in-prod
      DATABASE_ENABLED: 'true'
      DATABASE_CONNECTION_URI: postgresql://postgres:postgres@postgres:5432/evolution
      DATABASE_CONNECTION_CLIENT_NAME: evolution
      REDIS_ENABLED: 'true'
      REDIS_URI: redis://redis:6379
      REDIS_PREFIX_KEY: evolution
      WEBHOOK_GLOBAL_ENABLED: 'false'
      LOG_LEVEL: ERROR
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - evolution_data:/evolution/instances

  # ─── Backend NestJS ───────────────────────────────────────────────────────────
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: omnidesk_backend
    restart: unless-stopped
    ports:
      - '3000:3000'
    environment:
      NODE_ENV: production
      PORT: 3000
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USER: postgres
      DB_PASS: postgres
      DB_NAME: omnidesk
      REDIS_HOST: redis
      REDIS_PORT: 6379
      EVOLUTION_API_URL: http://evolution_api:8080
      EVOLUTION_API_KEY: omnidesk-evolution-key-change-in-prod
      JWT_SECRET: change-this-in-production-very-long-secret
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    env_file:
      - ./backend/.env

  # ─── Painel de Filas (Bull Board — dev only) ──────────────────────────────────
  bull_board:
    image: deadly0/bull-board
    container_name: omnidesk_bullboard
    restart: unless-stopped
    ports:
      - '3001:3000'
    environment:
      REDIS_HOST: redis
      REDIS_PORT: 6379
    depends_on:
      - redis
    profiles:
      - dev

volumes:
  postgres_data:
  redis_data:
  evolution_data:

networks:
  default:
    name: omnidesk_network
